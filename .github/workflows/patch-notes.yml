name: refresh-patch-notes

# 官网发新版本后，最多 6 小时这里的数据就会跟上；
# 客户端每 45 分钟回来看一次，所以「官网更新 → 用户看到」的延迟在一小时内。
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: '故意让抓取失败，用来验证告警链路'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-patch-notes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --quiet requests

      - name: Fetch patch notes
        env:
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          if [ "$FORCE_FAIL" = "true" ]; then
            echo '按 workflow_dispatch 的输入，故意失败' >&2
            exit 1
          fi
          python tools/refresh_patch_notes.py --out data/patch_notes.json

      # 抓取失败时脚本不会写文件，旧数据仍然可用；但没人知道它坏了。
      # 开一条 Issue，把「兜底已经失效」这件事顶到眼前。
      - name: Open issue when fetch fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --search '公告数据抓取失败 in:title' \
            --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "已有 $open 条未关闭的失败 Issue，不重复创建"
            exit 0
          fi

          body=$'GitHub Actions 抓取官网公告失败，data/patch_notes.json 已保留上一次成功的数据，客户端暂时不受影响。\n\n运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n处理办法见 README 的「官网改版了怎么办」：先判断是网络抖动（重跑一次即可）还是官网结构变了（改 tools/refresh_patch_notes.py；短期修不好就手工覆盖 JSON）。\n\n修好后关掉这个 Issue，下次再失败才会重新开。'

          gh issue create \
            --title "公告数据抓取失败（$(TZ='Asia/Shanghai' date +%F)）" \
            --body "$body"

      - name: Commit if changed
        if: success()
        run: |
          git config user.name 'mmo-trainer-bot'
          git config user.email 'mmo-trainer-bot@users.noreply.github.com'
          git add data/patch_notes.json
          if git diff --cached --quiet; then
            echo '数据没有变化，不提交'
            exit 0
          fi
          VERSION=$(python -c "import json;print(json.load(open('data/patch_notes.json'))['version'])")
          git commit -m "chore(patch-notes): ${VERSION}"
          git push
