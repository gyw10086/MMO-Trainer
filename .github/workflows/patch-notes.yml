name: refresh-patch-notes

# 官网发新版本后，最多 6 小时这里的数据就会跟上；
# 客户端每 45 分钟回来看一次，所以「官网更新 → 用户看到」的延迟在一小时内。
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-patch-notes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --quiet requests

      - name: Fetch patch notes
        run: python tools/refresh_patch_notes.py --out data/patch_notes.json

      - name: Commit if changed
        run: |
          git config user.name 'mmo-trainer-bot'
          git config user.email 'mmo-trainer-bot@users.noreply.github.com'
          git add data/patch_notes.json
          if git diff --cached --quiet; then
            echo '数据没有变化，不提交'
            exit 0
          fi
          VERSION=$(python -c "import json;print(json.load(open('data/patch_notes.json'))['version'])")
          git commit -m "chore(patch-notes): ${VERSION}"
          git push
